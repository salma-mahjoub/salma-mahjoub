<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Salma Mahjoub, mobile, full-stack and AI developer">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .blink { animation: blink 1s steps(1) infinite; }
    .code-one { animation: code-one 6s steps(1) infinite; }
    .code-two { animation: code-two 6s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    .scan { animation: scan 3s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes code-one { 0%, 42% { opacity: 1; } 43%, 100% { opacity: .25; } }
    @keyframes code-two { 0%, 42% { opacity: .25; } 43%, 100% { opacity: 1; } }
    @keyframes pulse { 50% { opacity: .55; transform: scale(.94); } }
    @keyframes scan { 0%, 100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(118px); opacity: .85; } }
  </style>
  <rect width="1200" height="300" rx="16" fill="#0f172a"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="44" cy="40" r="6" fill="#ef6b73"/><circle cx="66" cy="40" r="6" fill="#f4b942"/><circle cx="88" cy="40" r="6" fill="#52b788"/>
  <text x="44" y="89" class="mono" font-size="18" fill="#94a3b8">~/salma <tspan fill="#22d3ee">$</tspan> build --future</text>
  <text x="44" y="154" class="sans" font-size="60" font-weight="700" fill="#f8fafc">Salma Mahjoub</text>
  <text x="47" y="199" class="mono" font-size="19" fill="#cbd5e1">Mobile · Full-stack · AI Developer<tspan class="blink" fill="#22d3ee"> _</tspan></text>
  <text x="47" y="239" class="mono" font-size="15" fill="#22d3ee">designing useful products, end to end</text>
  <g transform="translate(775 28)">
    <rect width="370" height="244" rx="12" fill="#172033" stroke="#334155"/>
    <circle cx="22" cy="21" r="4" fill="#ef6b73"/><circle cx="36" cy="21" r="4" fill="#f4b942"/><circle cx="50" cy="21" r="4" fill="#52b788"/>
    <g class="mono" font-size="14">
      <text x="24" y="63" fill="#8fa3b8">const</text><text x="72" y="63" fill="#d9e4ee"> product = </text><text x="165" y="63" fill="#8ce99a">build</text><text x="205" y="63" fill="#d9e4ee">({</text>
      <text x="42" y="91" fill="#7dd3fc">mobile</text><text x="102" y="91" fill="#d9e4ee">: </text><text x="120" y="91" fill="#f9a8d4">true</text><text x="154" y="91" fill="#d9e4ee">,</text>
      <text x="42" y="119" fill="#7dd3fc">backend</text><text x="110" y="119" fill="#d9e4ee">: </text><text x="128" y="119" fill="#f9a8d4">true</text><text x="162" y="119" fill="#d9e4ee">,</text>
      <text x="42" y="147" fill="#7dd3fc">intelligence</text><text x="153" y="147" fill="#d9e4ee">: </text><text x="171" y="147" fill="#f9a8d4">true</text>
      <text x="24" y="175" fill="#d9e4ee">});</text>
      <text x="24" y="213" class="code-one" fill="#8ce99a">compiling a better experience</text>
      <text x="24" y="213" class="code-two" fill="#7dd3fc">shipping with intention</text>
    </g>
  </g>
  <g transform="translate(1072 112)">
    <rect x="0" y="0" width="52" height="105" rx="9" fill="#f8fafc" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="16" y="7" width="20" height="3" rx="1.5" fill="#526174"/>
    <circle class="pulse" cx="26" cy="41" r="12" fill="#0891b2"/>
    <path class="scan" d="M8 55h36" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="10" y="76" width="32" height="6" rx="3" fill="#d8e0ea"/><rect x="10" y="88" width="20" height="6" rx="3" fill="#d8e0ea"/>
  </g>
</svg>
